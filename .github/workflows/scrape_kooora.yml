name: Scrape Kooora News with Puppeteer

on:
  schedule:
    # تشغيل تلقائي كل ساعة (يمكنك تعديله)
    - cron: '0 * * * *'
  workflow_dispatch: # زر للتشغيل اليدوي المباشر من GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: |
          npm init -y
          npm install puppeteer

      - name: Extract News with Puppeteer
        uses: actions/github-script@v7
        with:
          script: |
            const puppeteer = require('puppeteer');
            const fs = require('fs');

            async function scrapeKooora() {
              console.log('🚀 جاري تشغيل المتصفح عبر Puppeteer...');
              
              const browser = await puppeteer.launch({
                headless: 'new',
                args: ['--no-sandbox', '--disable-setuid-sandbox']
              });

              const page = await browser.newPage();

              // تمويه المتصفح حتى لا يتم حظره
              await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36');

              console.log('🌐 الانتقال إلى صفحة أخبار كووورة...');
              await page.goto('https://www.kooora.com/?n=0', {
                waitUntil: 'networkidle2',
                timeout: 60000
              });

              // استخراج الأخبار من العناصر داخل الصفحة
              const newsList = await page.evaluate(() => {
                const articles = [];
                // استهداف عناوين وعناصر الأخبار في كووورة
                const elements = document.querySelectorAll('.fco-card, .newsList li, .headlines li');

                elements.forEach(el => {
                  const titleEl = el.querySelector('.fco-card__headline-text, a');
                  const imgEl = el.querySelector('img');
                  const linkEl = el.querySelector('a');

                  if (titleEl && titleEl.innerText.trim().length > 10) {
                    let imgSrc = imgEl ? (imgEl.getAttribute('data-src') || imgEl.src) : '';
                    if (imgSrc.includes('?')) imgSrc = imgSrc.split('?')[0]; // تنظيف رابط الصورة

                    articles.push({
                      title: titleEl.innerText.trim(),
                      link: linkEl ? linkEl.href : '',
                      image: imgSrc
                    });
                  }
                });

                return articles;
              });

              await browser.close();

              console.log(`✅ تم استخراج ${newsList.length} خبر بنجاح!`);
              console.log('أول 3 أخبار استُخرجت:', newsList.slice(0, 3));

              // حفظ النتائج في ملف JSON
              fs.writeFileSync('news.json', JSON.stringify(newsList, null, 2));
            }

            await scrapeKooora();

      - name: Commit and Push extracted news JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Update Kooora news data" || echo "No changes to commit"
          git push
